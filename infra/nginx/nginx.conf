events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream monitor_web { server monitor-web:8001; }
    upstream agent_service { server agent-service:8010; }
    upstream rag_service { server rag-service:8020; }
    upstream cad_service { server cad-service:8011; }
    upstream backend_service { server backend-service:8030; }
    upstream model_service { server model-service:8040; }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://agent_service;
        }

        location /rag/ {
            proxy_pass http://rag_service;
        }

        location /cad/ {
            proxy_pass http://cad_service;
        }

        location /backend/ {
            proxy_pass http://backend_service;
        }

        location /model/ {
            proxy_pass http://model_service;
        }

        location / {
            proxy_pass http://monitor_web;
        }
    }
}
