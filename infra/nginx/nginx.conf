events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream monitor_web { server monitor-web:8001; }
    upstream agent_service { server agent-service:8010; }
    upstream rag_service { server rag-service:8020; }
    upstream cad_service { server cad-service:8050; }
    upstream backend_service { server backend-service:8030; }
    upstream model_service { server model-service:8040; }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://agent_service;
        }

        # 业务服务只允许通过 Agent 的受控 API 访问，不直接暴露内部管理接口。
        location /rag/ { return 404; }
        location /cad/ { return 404; }
        location /backend/ { return 404; }
        location /model/ { return 404; }

        location / {
            proxy_pass http://monitor_web;
        }
    }
}
