events {}
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    sendfile on;
    upstream monitor_web { server monitor-web:8001; }
    server {
        listen 80;
        # Only expose through an HTTPS reverse proxy or SSH tunnel.
        auth_basic "IND-Agent";
        auth_basic_user_file /etc/nginx/production.htpasswd;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        # Monitor owns /api/state, controls, and the Agent proxy boundary.
        # Never expose raw backend/model tool endpoints through the gateway.
        location / { proxy_pass http://monitor_web; }
    }
}
