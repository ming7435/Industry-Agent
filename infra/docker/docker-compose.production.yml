services:
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD for production}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD for production}

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD for production}

  agent-service:
    environment:
      APP_ENV: production
      ALLOW_DEGRADED_STORAGE: "false"
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?set AGENT_API_TOKEN for production}
      RAG_ALLOWED_INGEST_ROOT: /app/services/rag-service/data
      RAG_ALLOW_LOCAL_FALLBACK: "false"
      WORKORDER_BACKEND: mysql
      BACKEND_SERVICE_BASE_URL: http://backend-service:8030
      MODEL_SERVICE_BASE_URL: http://model-service:8040

  rag-service:
    environment:
      RAG_ALLOW_LOCAL_FALLBACK: "false"

  cad-service:
    environment:
      APP_ENV: production
      CAD_ALLOW_DEMO_FALLBACK: "false"

  backend-service:
    environment:
      APP_ENV: production
      BACKEND_STORAGE: mysql

  model-service:
    environment:
      APP_ENV: production
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      MODEL_CHAT_PROVIDER: ${MODEL_CHAT_PROVIDER:-deepseek}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}

  otel-collector:
    volumes:
      - ../otel/otel-collector.production.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      OTEL_BACKEND_ENDPOINT: ${OTEL_BACKEND_ENDPOINT:?set OTEL_BACKEND_ENDPOINT for production observability}
      OTEL_BACKEND_AUTH: ${OTEL_BACKEND_AUTH:-}
