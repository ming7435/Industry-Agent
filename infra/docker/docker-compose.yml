name: industry-agent-infra

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-industry_agent}
      MYSQL_USER: ${MYSQL_USER:-industry}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-industry}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: >-
      /usr/local/bin/etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd-data:/etcd

  minio:
    # Keep the image overridable for air-gapped/local registries.  This pinned
    # public tag is available on Docker Hub and matches the local development
    # image used by the repository.
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus:
    image: milvusdb/milvus:v2.4.15
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ../otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  rag-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.rag
    restart: unless-stopped
    environment:
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8020
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-industry}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-industry}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-industry_agent}
      MILVUS_URI: http://milvus:19530
      MODEL_SERVICE_BASE_URL: http://model-service:8040
      RAG_ALLOW_LOCAL_FALLBACK: ${RAG_ALLOW_LOCAL_FALLBACK:-false}
      RAG_EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1024}
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
      model-service:
        condition: service_healthy
    ports:
      - "${RAG_PORT:-8020}:8020"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 20

  cad-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.cad
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      CAD_ALLOW_DEMO_FALLBACK: ${CAD_ALLOW_DEMO_FALLBACK:-false}
      CAD_CI_FIXTURE: ${CAD_CI_FIXTURE:-false}
      CAD_MYSQL_HOST: mysql
      CAD_MYSQL_PORT: 3306
      CAD_MYSQL_DATABASE: ${MYSQL_DATABASE:-industry_agent}
      CAD_MYSQL_USER: ${MYSQL_USER:-industry}
      CAD_MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-industry}
      MODEL_SERVICE_BASE_URL: http://model-service:8040
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      model-service:
        condition: service_healthy
    ports:
      - "${CAD_PORT:-8011}:8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8010
      RAG_SERVICE_BASE_URL: http://rag-service:8020
      MCP_CAD_URL: http://cad-service:8011
      BACKEND_SERVICE_BASE_URL: http://backend-service:8030
      MCP_MES_URL: http://backend-service:8030
      MCP_INVENTORY_URL: http://backend-service:8030
      MCP_QMS_URL: http://backend-service:8030
      MODEL_SERVICE_BASE_URL: http://model-service:8040
      EVENT_STORE_PATH: /app/.runtime/events.sqlite3
      PENDING_TASK_STORE_PATH: /app/.runtime/pending.sqlite3
      WORKORDER_STORE_PATH: /app/.runtime/workorders.sqlite3
      REPORT_STORE_PATH: /app/.runtime/reports.sqlite3
      LEARNING_RESULT_STORE_PATH: /app/.runtime/learning.sqlite3
      REDIS_URL: redis://redis:6379/0
      WORKORDER_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-industry}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-industry}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-industry_agent}
      ALLOW_DEGRADED_STORAGE: ${ALLOW_DEGRADED_STORAGE:-false}
      RAG_ALLOW_LOCAL_FALLBACK: ${RAG_ALLOW_LOCAL_FALLBACK:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      backend-service:
        condition: service_healthy
      model-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      cad-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - agent-runtime-data:/app/.runtime
    ports:
      - "${AGENT_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent-migrate:
    profiles: ["migrate"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent
    restart: "no"
    command: ["python", "-m", "alembic", "-c", "services/agent-service/alembic.ini", "upgrade", "head"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-industry}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-industry}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-industry_agent}
    depends_on:
      mysql:
        condition: service_healthy

  monitor-web:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent
    restart: unless-stopped
    command: ["python", "services/agent-service/monitor_web_server.py"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONITOR_WEB_HOST: 0.0.0.0
      MONITOR_WEB_PORT: 8001
      AGENT_SERVICE_BASE_URL: http://agent-service:8010
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      agent-service:
        condition: service_started
    ports:
      - "${MONITOR_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    profiles: ["apps", "gateway"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent-service:
        condition: service_started
      monitor-web:
        condition: service_started
      rag-service:
        condition: service_started
      cad-service:
        condition: service_started
      backend-service:
        condition: service_started
      model-service:
        condition: service_started

  backend-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      BACKEND_STORAGE: ${BACKEND_STORAGE:-mysql}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-industry}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-industry}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-industry_agent}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${BACKEND_PORT:-8030}:8030"

  model-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.model
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${MODEL_PORT:-8040}:8040"

volumes:
  agent-runtime-data:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
