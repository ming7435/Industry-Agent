name: hybrid_search_skill
version: 1.0
goal: Run a broad knowledge search when no specialized source is required.
trigger: default
steps:
  - classify_query
  - search_knowledge
  - rerank_evidence
  - validate_evidence
  - normalize_query
  - select_sources
  - build_filters
  - search
  - build_evidence
  - rank
  - validate_sources
  - build_result
tools:
  - search_knowledge
  - search_sop
  - search_manual
  - search_fault_cases
  - search_semantic_memory
  - fetch_document
  - fetch_chunk
