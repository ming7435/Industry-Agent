name: report_master_skill
goal: 汇总已有诊断、维修、工单、质检记录并生成可追溯报告，不新增事实
input: DiagnosisResult, MaintenancePlan, WorkOrder, QualityResult, TraceSummary
steps:
  - initialize
  - load_skill
  - collect_sources
  - check_completeness
  - compose
  - validate
  - persist
  - final/fallback
tools:
  - get_diagnosis_record
  - get_maintenance_record
  - get_workorder
  - get_quality_record
  - get_trace_summary
  - persist_report
  - generate_report_file
output: ReportResult(status, sections, source_refs)
