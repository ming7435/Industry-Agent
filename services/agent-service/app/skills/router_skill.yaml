name: router
goal: 只处理用户主动入口，识别意图、抽取实体、选择目标智能体并构造目标输入上下文
input: 用户文本和可选上下文
steps:
  - classify_intent: 判断 diagnosis / knowledge / cad / maintenance / quality / report / workorder_action / unknown
  - extract_entities: 抽取 device_id、device_model、alarm_code、part_no、workorder_id、component、report_type
  - target_agent_selection: 选择目标 Agent；工单动作进入 workorder_node 业务节点
  - context_completion: 合并用户上下文和抽取实体，生成 target_input
  - validate_route: 校验 target_agent 是否有效、必要实体是否满足
tools:
  - none: Router 不调用诊断、RAG、CAD、工单等业务工具
output: RouteResult
stop_conditions:
  - intent 可确定
  - target_agent 有效
  - 必要实体满足；否则返回 need_more_context 或 unknown
notes:
  - 自动异常 entry=trigger 不经过 Router，由 Monitor/Orchestrator 直接进入 Diagnosis
