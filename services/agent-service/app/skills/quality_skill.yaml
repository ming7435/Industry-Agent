name: part_quality_master_skill
goal: 对生产出来的零件执行尺寸、外观、材料、功能和工艺质量检测，并返回结构化 QualityResult
input: QualityRequest
steps:
  - initialize
  - load_skill
  - load_part
  - load_inspection_plan
  - inspect_dimensions
  - inspect_appearance
  - inspect_material
  - inspect_function
  - inspect_process
  - validate_part
  - decision
  - final/fallback
tools:
  - get_production_part
  - get_part_specification
  - inspect_part_dimensions
  - inspect_part_appearance
  - inspect_part_material
  - inspect_part_function
  - inspect_part_process
output: QualityResult
