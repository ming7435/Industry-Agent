name: quality_master_skill
goal: 验证维修完成、报警清除、参数恢复与SOP合规，并闭环工单
input: QualityRequest
steps:
  - initialize
  - load_skill
  - load_workorder
  - load_repair_feedback
  - verify_device
  - verify_alarm
  - verify_parameters
  - verify_sop
  - validate
  - decision
  - final/fallback
tools:
  - get_workorder
  - get_repair_feedback
  - get_device_status
  - get_device_history
  - get_active_alarms
  - check_workorder_compliance
  - verify_alarm_clearance
  - compare_pre_post_metrics
output: QualityResult
