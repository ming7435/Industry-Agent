name: maintenance_master_skill
goal: 生成安全可执行的维修方案
input: MaintenanceRequest, DiagnosisResult, KnowledgeResult, CADResult
steps:
  - initialize
  - load_skill
  - assess_diagnosis
  - request_knowledge
  - request_cad
  - plan_repair
  - check_parts_tools
  - safety_validate
  - validate
  - prepare_workorder
  - final
  - fallback
tools:
  - query_inventory
  - query_part_availability
  - get_workorder_template
  - submit_workorder_draft
output: MaintenancePlan
