name: cad_master_skill
version: 1.0
goal: 查询 CAD、BOM、零件位置和装配关系，返回可追踪工程证据包
input: CADRequest 或零件/装配查询
steps:
  - initialize
  - load_skill
  - resolve_component
  - plan_engineering_query
  - query
  - observe
  - validate_relation
  - final
  - fallback
tools:
  - query_drawing
  - query_bom
  - query_part
  - query_relation
  - fetch_engineering_record
output: CADResult
