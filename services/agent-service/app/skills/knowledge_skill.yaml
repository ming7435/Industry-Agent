name: knowledge_master_skill
version: 1.0
goal: 检索、去重、融合并返回可追踪工业知识 Evidence Pack
input: KnowledgeRequest
steps:
  - initialize
  - load_skill
  - classify_query
  - plan_retrieval
  - retrieve
  - observe
  - refine_query
  - rerank
  - validate
  - final
  - fallback
tools:
  - search_knowledge
  - search_alarm_knowledge
  - search_sop
  - search_manual
  - search_fault_cases
  - search_semantic_memory
  - fetch_document
  - fetch_chunk
sub_skills:
  alarm_knowledge_skill:
    trigger: alarm_code_or_exact_code
  sop_retrieval_skill:
    trigger: sop_or_repair_steps
  fault_case_retrieval_skill:
    trigger: case_or_history
  hybrid_retrieval_skill:
    trigger: default
output: KnowledgeResult
