name: knowledge_master_skill
version: 1.0
goal: 检索、去重、融合并返回可追踪工业知识 Evidence Pack
input: KnowledgeRequest 或检索问题
steps:
  - classify_query
  - build_filters
  - retrieve
  - deduplicate
  - rank
  - validate_sources
  - output_evidence_pack
tools:
  - search_knowledge
sub_skills:
  alarm_knowledge_skill:
    trigger: alarm_code_or_exact_code
  sop_retrieval_skill:
    trigger: sop_or_repair_steps
  fault_case_retrieval_skill:
    trigger: case_or_history
  hybrid_retrieval_skill:
    trigger: default
output: KnowledgeResult
